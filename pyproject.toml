[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netconnect"
version = "2.1.1"
description = "Cross-platform TCP/UDP connection testing tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
netconnect = "netconnect.cli:main"

[project.urls]
Homepage = "https://github.com/DavoudTeimouri/NetConnect-Tool"
Repository = "https://github.com/DavoudTeimouri/NetConnect-Tool"
Issues = "https://github.com/DavoudTeimouri/NetConnect-Tool/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["netconnect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyinstaller]
name = "netconnect"
onefile = true
clean = true
noconfirm = true
strip = true
console = true
hidden-imports = ["yaml", "platformdirs", "tabulate"]