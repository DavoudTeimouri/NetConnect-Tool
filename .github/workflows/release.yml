name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: netconnect-linux-x86_64
          - os: windows-latest
            artifact: netconnect-windows-x86_64.exe
          - os: macos-latest
            artifact: netconnect-macos-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build portable executable
        run: |
          python scripts/build_portable.py 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log

      - name: Rename artifact
        run: |
          if exist dist\netconnect.exe (
            move dist\netconnect.exe "dist\${{ matrix.artifact }}"
          ) else (
            mv dist/netconnect "dist/${{ matrix.artifact }}"
          )

      - name: Verify binary
        run: |
          ./dist/${{ matrix.artifact }} --version
          ./dist/${{ matrix.artifact }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog for this version only
        run: |
          python3 scripts/extract_changelog.py ${{ steps.version.outputs.version }}
          echo "=== Generated release-notes.md ==="
          cat release-notes.md
          echo "=== end ==="

      - name: Delete existing release (clean state)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes --repo "${{ github.repository }}" || true

      - name: Create Release with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "NetConnect ${{ steps.version.outputs.tag }} - Cross-Platform Release" \
            --notes-file release-notes.md \
            --latest \
            artifacts/netconnect-linux-x86_64/netconnect-linux-x86_64 \
            artifacts/netconnect-windows-x86_64.exe/netconnect-windows-x86_64.exe \
            artifacts/netconnect-macos-x86_64/netconnect-macos-x86_64