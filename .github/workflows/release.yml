name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build portable executable
        run: |
          python scripts/build_portable.py

      - name: Verify binary
        run: |
          ./dist/netconnect --version
          ./dist/netconnect --help

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          VERSION=${TAG#v}
          mv dist/netconnect "dist/netconnect-linux-x86_64"
          echo "asset=dist/netconnect-linux-x86_64" >> $GITHUB_OUTPUT
        id: assets

      - name: Extract changelog for version
        run: |
          VERSION=${TAG#v}
          # Extract section for this version
          awk -v ver="## \\[$VERSION\\]" '
            $0 ~ ver {p=1; next}
            p && /^## \[/ && !/^## \[' ver '\]/ {p=0}
            p {print}
          ' CHANGELOG.md > release-notes.md
          # If no specific section found, use last 50 lines as fallback
          if [ ! -s release-notes.md ]; then
            tail -50 CHANGELOG.md > release-notes.md
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NetConnect ${{ steps.version.outputs.tag }} - Cross-Platform Release
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: ${{ steps.assets.outputs.asset }}
          generate_release_notes: false