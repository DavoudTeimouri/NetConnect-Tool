name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_type: deb
          - os: windows-latest
            artifact_type: zip
          - os: macos-latest
            artifact_type: bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build portable executable
        run: |
          python scripts/build_portable.py 2>&1 | tee build.log

      - name: Package (platform-specific)
        id: pkg
        run: |
          python scripts/package_artifact.py ${{ matrix.artifact_type }}

      - name: Verify artifact
        run: |
          python -c "import os; print('\n'.join(sorted(os.listdir('dist'))))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netconnect-${{ matrix.os }}-pkg
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          find artifacts -type f

      - name: Extract changelog for this version only
        run: |
          python3 scripts/extract_changelog.py ${{ steps.version.outputs.version }}
          echo "=== Generated release-notes.md ==="
          cat release-notes.md
          echo "=== end ==="

      - name: Delete existing release (clean state)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes --repo "${{ github.repository }}" || true

      - name: Create Release with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "NetConnect ${{ steps.version.outputs.tag }} - Cross-Platform Release" \
            --notes-file release-notes.md \
            --latest \
            $(find artifacts -type f -name 'netconnect-*' -print)
