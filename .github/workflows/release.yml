name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build portable executable
        run: |
          python scripts/build_portable.py

      - name: Verify binary
        run: |
          ./dist/netconnect --version
          ./dist/netconnect --help

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Prepare single asset
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Build creates 'netconnect', rename to platform-specific name
          mv dist/netconnect "dist/netconnect-linux-x86_64"
          echo "ASSET_PATH=dist/netconnect-linux-x86_64" >> $GITHUB_ENV

      - name: Extract changelog for this version only
        run: |
          python3 scripts/extract_changelog.py ${{ steps.version.outputs.version }}
          echo "RELEASE_BODY=release-notes.md" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NetConnect ${{ steps.version.outputs.tag }} - Cross-Platform Release
          body_path: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: false
          replace_artifacts: true
          fail_on_unmatched_files: true